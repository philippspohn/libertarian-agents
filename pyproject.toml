[project]
name = "libertarian-agents"
version = "0.1.0"
description = "A sandboxed multi-agent environment where self-determined agents share a filesystem and a message board."
requires-python = ">=3.11"
dependencies = [
  "openai>=1.60",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "typer>=0.15",
  "httpx>=0.27",
  "rich>=13",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
libagents = "libagents.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libagents"]
